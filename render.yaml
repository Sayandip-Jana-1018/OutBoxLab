# ---------------------------------------------------------------------------
# OutboxLab on Render.
#
# The frontend is NOT here - Next.js goes on Vercel. This file declares the
# part that cannot run serverless: a worker that must stay alive between jobs,
# and an SSE endpoint that holds connections open for minutes.
#
#   Render dashboard -> New -> Blueprint -> point at this repo
#
# Secrets are not in this file. `generateValue: true` has Render mint a value
# nobody ever sees; `sync: false` prompts for it on first deploy and stores it
# encrypted.
#
# ---------------------------------------------------------------------------
# Free tier caveats, which shape the whole file
# ---------------------------------------------------------------------------
#   * Background workers are a paid service type on Render. The API and worker
#     therefore run in ONE web service here (dist/server.js), which is why that
#     entrypoint exists. Split them - `node dist/index.js` plus a `type: worker`
#     - the moment you are on a paid plan.
#   * Free instances have no one-off jobs, so `preDeployCommand` is unavailable
#     and migrations run as part of the start command instead.
#   * Free instances sleep when idle. A sleeping instance delivers nothing;
#     on wake the boot reconciler re-enqueues everything still pending, so
#     nothing is lost, it is only late.
#   * Render's free Postgres expires after 30 days.
# ---------------------------------------------------------------------------

databases:
  - name: outboxlab-postgres
    databaseName: outboxlab
    user: outboxlab
    plan: free

services:
  # --- Redis: BullMQ queue, quota counters, pacer, pub/sub ---------------
  - type: keyvalue
    name: outboxlab-redis
    plan: free
    ipAllowList: []              # private network only
    # BullMQ holds durable job state here. Eviction would silently drop mail;
    # Postgres can rebuild the queue, but that should never be routine.
    maxmemoryPolicy: noeviction

  # --- API + worker (single service on free) -----------------------------
  - type: web
    name: outboxlab-api
    runtime: docker
    plan: free
    # Paths are relative to the repository root, so the build context is stated
    # explicitly rather than relying on rootDir semantics.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    # No dockerCommand: the image's entrypoint script runs the migration and
    # then the app. Render exec's this field rather than evaluating it as a
    # shell line, so a `sh -c "a && b"` one-liner here is looked up as a single
    # binary with that name and exits 127.
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: DATABASE_URL
        fromDatabase:
          name: outboxlab-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: outboxlab-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true      # never printed, never committed
      - key: COOKIE_SECURE
        value: "true"            # the frontend is a different origin, over HTTPS
      - key: APP_URL
        sync: false              # https://outboxlab-api.onrender.com
      - key: FRONTEND_URL
        sync: false              # https://<your-app>.vercel.app
      - key: DEMO_EMAIL
        value: demo@outboxlab.dev
      - key: DEMO_PASSWORD
        sync: false
      # Seeds the demo account and two Ethereal mailboxes on boot. Free
      # instances have no shell to run the seed by hand, so without this the
      # deployed app has no account to sign in with. Idempotent.
      - key: RUN_SEED
        value: "true"
      - key: BULL_BOARD_USER
        value: admin
      - key: BULL_BOARD_PASSWORD
        generateValue: true
      - key: ENABLE_TIME_MACHINE
        value: "false"           # demo-only: it clears live quota buckets
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: RATE_WINDOW_MS
        value: "3600000"
      - key: SWEEPER_INTERVAL_MS
        value: "60000"
